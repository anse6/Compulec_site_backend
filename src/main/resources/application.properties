# ===========================
# Secrets (JWT, SMTP, Chatling, premier admin) : config/secrets.properties
# (hors du code source, voir config/secrets.properties.example)
# ===========================
spring.config.import=optional:file:./config/secrets.properties

# ===========================
# Configuration Serveur
# ===========================
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/api

# ===========================
# Configuration Base de Données MySQL (XAMPP : user=root, password=vide)
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/compulec_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# Configuration JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Configuration JWT
# ===========================
# Access token : 15 minutes (renouvelé automatiquement via le refresh token)
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000

# ===========================
# Configuration Springdoc / Swagger
# ===========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===========================
# Configuration Spring Mail
# Le mot de passe est dans config/secrets.properties
# ===========================
spring.mail.host=mail.compulec.com
spring.mail.port=465
spring.mail.username=admin@compulec.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true

# ===========================
# Configuration Logging
# ===========================
logging.level.com.compulec.backend=INFO
logging.level.org.springframework.security=INFO

# ===========================
# Configuration Upload Fichiers (Images Projets)
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB


# ===========================
# Configuration Jackson (JSON)
# ===========================
spring.jackson.parser.allow-unquoted-control-chars=true

# ===========================
# URL publique du frontend (liens des e-mails d'invitation et de réinitialisation)
# ===========================
app.frontend-url=http://localhost:5173

# ===========================
# Cookie du refresh token (HttpOnly, SameSite=Strict)
# Mettre true dès que le site est servi en HTTPS (production)
# ===========================
app.cookie.secure=false

# ===========================
# Limitation de débit par IP (connexion, 2FA, formulaires publics)
# trust-forwarded-for=true uniquement derrière un reverse proxy de confiance (nginx…)
# ===========================
app.rate-limit.enabled=true
app.rate-limit.trust-forwarded-for=false

# ===========================
# Assistant IA du chat
# app.ai.provider : auto (Chatling si configuré, sinon Claude), chatling ou anthropic.
# Clés dans config/secrets.properties (chatling.api.key, anthropic.api-key). Sans clé : réponses par mots-clés.
# ===========================
app.ai.enabled=true
app.ai.provider=auto
# Chatling : chatbot « Compulec », modèle 32 = Claude Haiku 4.5 (1 crédit/réponse), langue 1 = Auto
chatling.chatbot.id=2526884317
chatling.ai-model-id=32
chatling.language-id=1
# Claude (si vous utilisez une clé Anthropic à la place de Chatling)
app.ai.model=claude-opus-5-5
app.ai.max-tokens=4096
app.ai.max-replies-per-session=30

# ===========================
# Maintenance automatique du chat
# ===========================
app.chat.maintenance.enabled=true
# Relance de l'équipe si personne ne prend en charge une demande de conseiller
app.chat.waiting-reminder-minutes=15
# Fermeture des conversations inactives (avec le bot / avec l'équipe)
app.chat.close-bot-after-hours=24
app.chat.close-team-after-hours=48
# Conversations terminées supprimées après ce délai (données personnelles)
app.chat.retention-days=365
