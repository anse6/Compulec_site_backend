# ===========================
# Configuration Base de Données H2 (En Mémoire pour les Tests)
# ===========================
spring.datasource.url=jdbc:h2:mem:compulec_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===========================
# Configuration JPA / Hibernate
# ===========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===========================
# Configuration Spring Mail
# ===========================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@compulec.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false

# ===========================
# Configuration JWT pour les Tests
# ===========================
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=60000
application.security.jwt.refresh-token.expiration=300000

# ===========================
# Fichiers Uploads temporaires pour les Tests
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===========================
# Divers
